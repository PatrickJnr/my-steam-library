name: refresh-data
on:
  workflow_dispatch: # allows manual triggering
  schedule:
    # 1st and 15th of each month at 00:00 UTC, roughly every two weeks.
    # Cron here is UTC, so during British Summer Time this fires at 01:00 local.
    - cron: '0 0 1,15 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Initialize python env
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tqdm beautifulsoup4 lxml
      - name: Verify Steam credentials
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}
        run: |
          if [ -z "$STEAM_API_KEY" ] || [ -z "$STEAM_USER_ID" ]; then
            echo "::error::STEAM_API_KEY and STEAM_USER_ID must both be set in the repository secrets."
            exit 1
          fi

          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.steampowered.com/IPlayerService/GetOwnedGames/v0001/?key=${STEAM_API_KEY}&steamid=${STEAM_USER_ID}&format=json&include_played_free_games=1")
          echo "Steam GetOwnedGames responded with HTTP ${status}"

          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::error::Steam rejected the API key (HTTP ${status}). Create a new key at https://steamcommunity.com/dev/apikey and update the STEAM_API_KEY secret."
            exit 1
          fi

          if [ "$status" != "200" ]; then
            echo "::error::Unexpected response from Steam (HTTP ${status}). Check STEAM_USER_ID is a steamID64."
            exit 1
          fi
      - name: Clone steam_stats
        run: |
          git clone https://github.com/dbeley/steam_stats
      - name: Extract Steam appids of owned games
        run: |
          python steam_stats/scripts/get_ids.py -u $STEAM_USER_ID -f ids.csv -t owned
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}
      - name: Verify owned games were returned
        run: |
          if [ ! -s ids.csv ]; then
            echo "::error::ids.csv is missing or empty, so no owned games were returned."
            exit 1
          fi

          apps=$(( $(wc -l < ids.csv) - 1 ))
          echo "ids.csv contains ${apps} appid(s)"

          if [ "$apps" -lt 1 ]; then
            echo "::error::No owned games were returned. Check that the Steam profile's 'Game details' privacy is set to Public and that STEAM_USER_ID is a steamID64."
            exit 1
          fi
      - name: Extract playtime data
        run: |
          python steam_stats/scripts/get_playtime.py -u $STEAM_USER_ID -f playtime.csv
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}
      - name: Extract Steam data from appids
        run: |
          python -m steam_stats.steam_stats -f ids.csv --export_filename game_info.csv
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}
      - name: Cleanup repository
        run: |
          rm -r steam_stats
      - name: Create new export
        run: |
          python steam_html_builder.py
      - name: Pull remote changes
        run: |
          git pull
      - uses: stefanzweifel/git-auto-commit-action@v4
